# ════════════════════════════════════════════════════════════════════════════
#  ملف مرجعي يدوي للمشروع — Muttajah Mall
#  مدخلات يدخلها المهندس بيده وتُعتمد مرجعاً تقرأه السكربتات (حصر الخرسانة أساساً).
#  تُستخدم لتعويض/تصحيح ما لا يُقرأ بثقة من لوحات CAD (مناسيب المتكرر/الـ Roof، اللبشة).
#
#  ملاحظة: صرّح المهندس بنشر هذا الملف — يُرفع على الريبو العام مع الأدوات (ليست أسراراً).
#
#  الأعراف:
#   • كل المناسيب بالمتر، نظام S.S.L (منسوب وجه السطح الإنشائي)، نفس مرجع اللوحات.
#   • الموجب فوق منسوب الصفر، السالب تحته (مثال: -3.30 = ٣٫٣٠م تحت الصفر).
#   • «ssl» قائمة لأن السقف الواحد قد يحمل أكثر من منسوب (بلاطة مُدرَّجة stepped slab)،
#     فيُؤخذ لكل عمود أقرب منسوب له. لو منسوب واحد اكتب قائمة من عنصر واحد: [ -3.30 ].
#   • القيمة الفاضية [] أو null = «لم تُدخَل بعد» — من فضلك املأها.
# ════════════════════════════════════════════════════════════════════════════

meta:
  project: "Muttajah Mall"
  level_system: "S.S.L (متر)"
  updated: "2026-11-17"        # عدّل التاريخ كلما حدّثت الملف
  authoritative_drawing: "drawings/2026-11-08-STR-MOTTAGAH.dxf"   # اللوحة المعتمدة للعمل (الأحدث — 8 نوفمبر)
  drawing_date: "2026-11-08"    # تاريخ اللوحة التي أرسلها المهندس؛ المستودع يعمل على هذا التحديث
  # الأدوات تختار أحدث لوحة في drawings/ تلقائياً. اللوحة 2026-09-27 مرجع فقط — لا تُستخدم في الحصر.
  # ✅ تحقّق (2026-11-17): مناسيب اللبشة (-8.85/-8.45/-7.35) والداتم (315.05) مطابقة تماماً للوحة الجديدة
  #    (رموز A-SYMB-LEVL؛ كل زوج نسبي↔مطلق يعطي 315.05). الجيومتري لم يتغيّر. تغيّر وحيد: بدروم -3.30→-3.85.

# ────────────────────────────────────────────────────────────────────────────
#  ٠) الربط المساحي (Datum) — منسوب المشروع ↔ المنسوب العالمي فوق سطح البحر
#     كل المناسيب أعلاه/أدناه منسوبة لـ«الصفر المعماري» للمبنى (0.00).
#     اللوحة أحياناً تتكلم بأرقام مطلقة (ارتفاع فوق سطح البحر / MSL)، فهذا الجسر بينهما.
#     نقطة الربط التي أعطاها المهندس:  منسوب المشروع -7.35  =  المطلق 307.70
# ────────────────────────────────────────────────────────────────────────────
datum:
  architectural_zero_msl: 315.05   # م — الصفر المعماري (0.00) = هذا الارتفاع فوق سطح البحر
  anchor: { project: -7.35, absolute: 307.70 }   # نقطة المعايرة المؤكّدة من المهندس
  confirmed_against: "2026-11-08"   # ✅ تحقّق: 9 أزواج نسبي↔مطلق على A-SYMB-LEVL كلها تعطي 315.05 بالضبط
  # عيّنات مؤكّدة من اللوحة: -7.35→307.70 (Foundation FSL) | -8.45→306.60 | -8.85→306.20 | -7.25→307.80
  # التحويل (offset = +315.05):
  #   absolute (MSL) = project + 315.05
  #   project        = absolute - 315.05
  convert: "absolute = project + 315.05  |  project = absolute - 315.05"
  # أمثلة سريعة (مشروع → مطلق):
  #   0.00 → 315.05   -3.30 → 311.75   -7.35 → 307.70   -8.45 → 306.60   -8.85 → 306.20
  note: "لو ظهر على سقف/عنصر رقم مطلق (مثلاً 307.70) فمنسوبه النسبي = الرقم - 315.05."

  # جدول المناسيب كما هو مُرمَّز فعلياً على طبقة A-SYMB-LEVL في اللوحة الجديدة (نسبي | مطلق | وصف).
  # مصدر تحقّق مباشر — كلها متوافقة مع الداتم 315.05. (مستخرَج آلياً 2026-11-17.)
  levels_as_drawn:
    - { rel: -8.85, msl: 306.20, desc: "قاع التأسيس (Foundation bottom) S.S.L" }
    - { rel: -8.45, msl: 306.60, desc: "اللبشة المنخفضة العامة S.S.L" }
    - { rel: -7.35, msl: 307.70, desc: "Foundation Structural Level FSL — أعلى قاعدة لبشة" }
    - { rel: -7.25, msl: 307.80, desc: "BASEMENT 02 FLOOR F.F.L" }
    - { rel: -3.85, msl: 311.20, desc: "BASEMENT Slab Structural S.S.L (كان -3.30 في القديمة)" }
    - { rel: -1.03, msl: 314.02, desc: "Ramp 2 Slab Structural S.S.L" }
    - { rel: -0.29, msl: 314.76, desc: "Landing Slab Structural S.S.L" }
    - { rel: 0.035, msl: 315.085, desc: "Ramp 1 Slab Structural S.S.L" }
    - { rel: 1.10,  msl: 316.15, desc: "Upper BASEMENT Slab Structural S.S.L" }

# ────────────────────────────────────────────────────────────────────────────
#  ١) مناسيب الأدوار (مناسيب أسقف S.S.L)
#     المفتاح = اسم السقف كما في اللوحات (بشرطة سفلية بدل المسافة).
#     المعروف حالياً مُعبّأ من توثيق المنهج؛ الناقص فاضٍ ([]) لتملأه.
# ────────────────────────────────────────────────────────────────────────────
levels:

  FOUNDATION:                   # الأساس (أعلى اللبشة) — قاع المرحلة ١ للأعمدة. التفصيل بقسم raft أدناه.
    ssl: []                     # اتركه فاضياً هنا لو المناسيب تختلف بالمنطقة؛ استخدم raft.zones
    note: "منسوب وجه اللبشة — أساس حساب ارتفاع أعمدة المرحلة الأولى"

  LOWER_BASEMENT_CEILING:       # سقف البدروم السفلي
    ssl: [ -3.85 ]             # ✅ مؤكّد (2026-11-17): نزل من -3.30 إلى -3.85 (السقف نزل 55سم) — MSL 311.20
    note: "تغيّر مؤكّد من المهندس: كان -3.30، أصبح -3.85 في لوحة 2026-11-08 (BASEMENT/Lower BASEMENT Slab S.S.L، مطلق 311.20)."

  UPPER_BASEMENT_CEILING:       # سقف البدروم العلوي — بلاطة مُدرَّجة (منسوبان)
    ssl: [ -0.10, 1.10 ]       # ✅ مؤكّد (2026-11-17): بلاطة مُدرَّجة؛ درجة -0.10 باقية + +1.10 (MSL 316.15)
    note: "مؤكّد من المهندس: بلاطة مُدرَّجة بدرجتين (-0.10 و +1.10). لوحة 2026-11-08 تُرمّز +1.10 صراحةً وقد لا تُظهر درجة -0.10 لكنها موجودة فعلياً (Upper BASEMENT Slab S.S.L)."

  GROUND_CEILING:               # سقف الأرضي
    ssl: [ 5.70 ]
    note: "من توثيق المنهج (قد توجد قيم مُدرَّجة إضافية — أضِفها لو لزم)"

  TYPICAL_CEILING:              # سقف المتكرر
    ssl: []                     # ← لم تُدخَل بعد — من فضلك أدخل المنسوب/المناسيب
    note: ""

  ROOF:                         # السقف العلوي (Roof / Top Roof)
    ssl: []                     # ← لم تُدخَل بعد — من فضلك أدخل المنسوب/المناسيب
    note: ""

# ────────────────────────────────────────────────────────────────────────────
#  ٢) اللبشة (الأساس) — مناسيب + سماكات + مناطق
#     • default_top: منسوب وجه اللبشة العام لو موحّد لكل المشروع (وإلا اتركه null).
#     • zones: لكل منطقة لها منسوب أو سماكة مختلفة — بند مستقل.
#       - top:       منسوب وجه اللبشة (م)  ← القاع الذي يبدأ منه العمود
#       - bottom:    منسوب قاع اللبشة (م)  (اختياري؛ لو موجود تُحسب السماكة = top - bottom)
#       - thickness: سماكة اللبشة (م)      (اكتبها مباشرة، أو اتركها لتُحسب من top/bottom)
#       - bounds:    وصف الحدود/المحاور (نص حر) — مثلاً "بين المحاور A-D / 1-4" (اختياري)
#       - note:      أي ملاحظة
#     أضِف أو احذف مناطق بحرية. املأ على الأقل منطقة واحدة أو default_top.
# ────────────────────────────────────────────────────────────────────────────
raft:
  # النموذج المُثبت: اللبشة مُدرَّجة، قاع التأسيس ثابت تقريباً، ووجه كل منطقة = القاع + سماكتها.
  # الأداة والتفاصيل: scripts/raft_footings.py + reference/raft-findings.md
  formation_level: -8.85        # م — قاع التأسيس (datum). مُعاير على: t=0.40→-8.45 و t=1.50→-7.35
  level_formula: "top = formation_level + thickness(m)"
  # جدول السماكة(مم)→الوجه(م): 400→-8.45(أخفض) 700→-8.15 1000→-7.85 1100→-7.75 1300→-7.55 1500→-7.35(أعلى)
  # تنبيه: قد يكون المهندس عدّل رقم سماكة في لوحته — عند الاختلاف تُعتمد قيمة المهندس.

  zones:
    - name: "الجزء المنخفض (عام)"
      thickness: 0.40
      top:       -8.45           # أخفض منسوب لبشة — مؤكّد من المهندس (السمبيتات -8.85 فأدنى مستبعدة)
      bounds:    "المساحة العامة للّبشة + جيوب بين السملات بنفس المنسوب (تُكتشَف وقت الحصر)"
      note:      "مؤكّد"

    - name: "أعلى قاعدة (×2)"
      thickness: 1.50
      top:       -7.35           # أعلى قاعدة باللبشة — مؤكّد من المهندس (الفرق عن المنخفض = 1.10م)
      bounds:    "قاعدتان مستطيلتان ~5500×4500 على طبقة R.C. footing"
      note:      "الأعلى"

    - name: "الزون الأوسط غير المنتظم"
      thickness: 1.10
      top:       -7.75           # مشتق — قد يختلف لو عُدّلت السماكة في اللوحة
      bounds:    "مضلّع 10 رؤوس ~23803×28525 بناشز متداخل بين قاعدتَي t=1000"
      note:      "شكل غير منتظم (ليس مستطيلاً) — راجع output/raft-footings-shapes.png"

    # مناطق أخرى مكتشفة (مشتقّة): t=1300→-7.55 (×2) ، t=1000→-7.85 (×2) ، t=700→-8.15 (×2)

  # السملات (17 سمل): منسوب الظهر = -8.85 + العمق؛ الظاهر فوق اللبشة المنخفضة = العمق - 400مم.
  #   S300×1500→ظاهر1.10(ظهر-7.35) 1300→0.90(-7.55) 1100→0.70(-7.75) 1000→0.60(-7.85) 700→0.30(-8.15)
  beams_ref: "التفاصيل والجدول في reference/raft-beams.md — الأداة scripts/raft_footings.py --beams"

# ────────────────────────────────────────────────────────────────────────────
#  ٣) كمرات الأسقف (Ceiling beams) — لحصر خرسانة السقف (بلاطة + كمرات)
#     • المقطع (عرض×عمق) مكتوب في ليبل كل كمرة على المسقط: MARK(W X D) مثل B2(300X600).
#       ليس في جدول — نفس الماركة لها مقاطع متعددة، فيُقرأ المقطع لكل كمرة من ليبلها.
#     • جدول "Beams Reinforcement Table" (طبقة 00-EG-Text) يعطي التسليح فقط (B1..B5/CA1..CA4).
#     • قاعدة الخرسانة: الكمرة متداخلة مع البلاطة بسُمك البلاطة → يُحصَر الظاهر أسفلها فقط:
#         حجم الكمرة = W × (D − t_slab) × L   (م³)   [t_slab = SLAB=220مم]   مثال: بلاطة200 كمرة300×700→ظاهر500
#     • INVERTED/INV. = كمرة مقلوبة (ناشزة لأعلى) — نفس المعادلة؛ لا تُنقِص ارتفاع العمود أسفلها.
#     • S -Beams = سملات الأساس S(WxD) منفصلة (قسم raft أعلاه) — ليست كمرات سقف.
# ────────────────────────────────────────────────────────────────────────────
beams:
  section_source: "plan label MARK(W X D) — e.g. B2(300X600); not a schedule"
  layers: [ "ST-203-SLAB-TXT", "BEAMS" ]       # S -Beams = سملات أساس منفصلة
  volume_formula: "V = (W/1000) × ((D − t_slab)/1000) × L   ;   t_slab = SLAB thickness (0.22)"
  double_count_rule: "يُحصَر الجزء الظاهر أسفل البلاطة فقط (D − t_slab)؛ الجزء داخل البلاطة ضمن مساحة البلاطة"
  variable_depth: "MARK(W X D1/D2) مثل B5(300X600/1350) = عمقان (هانش/مُدرَّج) → متوسط أو تقسيم"
  inverted: "INVERTED/INV. = مقلوبة (لأعلى) — نفس المعادلة؛ العمود أسفلها يقف عند قاع البلاطة لا الكمرة"
  marks_seen:                                   # الماركة → المقاطع المرصودة على المسقط (مم)
    B1:  [ "120x600" ]
    B2:  [ "300x600", "200x700", "250x700", "250x600", "300x500", "300x700" ]
    B3:  [ "300x600", "250x600", "250x700", "300x400/850", "300x700" ]
    B4:  [ "300x800", "300x600", "200x700", "250x1400", "300x700" ]
    B5:  [ "300x600/1350" ]
    CA2: [ "300x600", "300x500", "300x700" ]
    CA3: [ "300x1400" ]
    CA4: [ "300x900" ]
    # CA1: جدول التسليح فقط (لا ليبل على المسقط)
  status: "موثّق — لم يُبرمَج بعد؛ يُبنى beams_takeoff.py عند طلب حصر سقف. التفاصيل: skill-build/concrete-takeoff/references/concrete-method.md (BEAMS)"
